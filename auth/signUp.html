<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KoloRise</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/signUp.css">
    <link rel="stylesheet" href="../styles/motion.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4" style="margin-bottom: 20px;">
                <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 12px;">
                    <div class="logo-mark">
                        <img src="../assets/images/KoloRise-Logo-001.png" alt="KoloRise logo">
                    </div>
                    <span class="logo-text">Kolo<span>Rise</span></span>
                </a>
                <h2>Create Account</h2>
                <p style="font-size: 13px; color: var(--gray-500);">Start your savings and growth journey today.</p>
            </div>

            <div id="errorBox" class="error-msg" role="alert" aria-live="polite"></div>

            <!-- The form ID and input IDs are used by js/auth.js. -->
            <form id="signUpForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Ogunfadewo David" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="davidayodele377@gmail.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" minlength="8" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="signUpBtn">Create Account</button>
            </form>
            <div style="display: flex; align-items: center; text-align: center; margin: 14px 0; color: var(--gray-400); font-size: 12px;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gray-200);">
                <span style="padding: 0 10px;">Or continue with</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gray-200);">
            </div>

            <button type="button" id="googleSignInBtnSignUp" data-google-auth class="btn btn-lg auth-google-button">
                <img src="../assets/icons/google_icon.png" alt="Google logo" width="22" height="20" style="display: block; object-fit: contain;">
                Sign up with Google
            </button>

            <div class="auth-footer" style="margin-top: 14px;">
                Already have an account? <a href="signIn.html">Sign In</a>
            </div>
        </div>
    </div>
    <script src="../js/auth.js" type="module"></script>
    <script src="../js/authState.js" type="module"></script>
    <script src="../js/motion.js" type="module"></script>
</body>

</html>
